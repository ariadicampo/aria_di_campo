<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#CFE1EB">
  <title>Aria di Campo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #333;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.42)),
        url("copertina.jpg");

      background-size: cover;
      background-position: center;
    }

    .welcome {
      max-width: 700px;
      width: 100%;
      color: white;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 8px;
      margin: 0 auto 28px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    }

    .welcome-text {
      font-size: 18px;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    h1 {
      font-size: 54px;
      font-weight: 600;
      margin-bottom: 15px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 40px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .start-button {
      display: inline-block;
      padding: 16px 36px;
      background: #CFE1EB;
      color: black;
      text-decoration: none;
      border-radius: 30px;
      font-size: 17px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .welcome-text {
        font-size: 15px;
      }

      .subtitle {
        font-size: 17px;
      }

      .logo {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="welcome">

      <img src="logo.jpeg" alt="Logo Aria di Campo" class="logo">

      <div class="welcome-text">
        Benvenuti
      </div>

      <h1>Aria di Campo</h1>

      <p class="subtitle">
        La vostra casa nel Borgo di Campo Ligure
      </p>

      <a href="#" class="start-button">
        Scopri la casa →
      </a>

    </div>

  </section>

</body>
</html>
