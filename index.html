<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#CFE1EB">
  <title>Aria di Campo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #333;
    }

    /* HOME */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.42)),
        url("copertina.jpg");

      background-size: cover;
      background-position: center;
    }

    .welcome {
      max-width: 700px;
      width: 100%;
      color: white;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 145px;
      height: 145px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      padding: 8px;
      margin: 0 auto 28px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    }

    .welcome-text {
      font-size: 18px;
      letter-spacing: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    h1 {
      font-size: 54px;
      font-weight: 600;
      margin-bottom: 15px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 40px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .start-button {
      display: inline-block;
      padding: 16px 36px;
      background: #CFE1EB;
      color: #3f4d39;
      text-decoration: none;
      border-radius: 30px;
      font-size: 17px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      cursor: pointer;
    }

    /* MENU */

    #menu {
      min-height: 100vh;
      padding: 35px 20px 50px;
      background: #f7f5ef;
    }

    .menu-container {
      max-width: 800px;
      margin: auto;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    .language-select {
      border: 1px solid #CFE1EB;
      background: white;
      padding: 9px 12px;
      border-radius: 20px;
      color: #3f4d39;
      font-size: 14px;
    }

    .menu-title {
      text-align: center;
      color: #3f4d39;
      font-size: 32px;
      margin-bottom: 30px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .menu-card {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 25px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      color: #3f4d39;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(0,0,0,0.12);
    }

    .menu-icon {
      font-size: 34px;
      display: block;
      margin-bottom: 10px;
    }

    .menu-card h3 {
      font-size: 17px;
      font-weight: 600;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 35px;
      color: #3f4d39;
      text-decoration: none;
      font-size: 15px;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 40px;
      }

      .welcome-text {
        font-size: 15px;
      }

      .subtitle {
        font-size: 17px;
      }

      .logo {
        width: 120px;
        height: 120px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .menu-title {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <!-- HOME -->

  <section class="hero" id="home">

    <div class="welcome">

      <img src="logo.jpeg" alt="Logo Aria di Campo" class="logo">

      <div class="welcome-text">
        Benvenuti
      </div>

      <h1>Aria di Campo</h1>

      <p class="subtitle">
        La vostra casa nel Borgo di Campo Ligure
      </p>

      <a href="#menu" class="start-button">
        Scopri la casa →
      </a>

    </div>

  </section>


  <!-- MENU -->

  <section id="menu">

    <div class="menu-container">

      <div class="top-bar">
        <select class="language-select">
          <option>🇮🇹 Italiano</option>
          <option>🇬🇧 English</option>
          <option>🇩🇪 Deutsch</option>
          <option>🇫🇷 Français</option>
        </select>
      </div>

      <h2 class="menu-title">
        La vostra guida
      </h2>

      <div class="menu-grid">

        <button class="menu-card">
          <span class="menu-icon">🏡</span>
          <h3>La vostra casa</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🔑</span>
          <h3>Check-in & Check-out</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🚗</span>
          <h3>Il Garage e Parcheggi pubblici</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🧺</span>
          <h3>Come funziona la casa</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">📍</span>
          <h3>Scopri il territorio</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🍴</span>
          <h3>Dove mangiare</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🚗</span>
          <h3>Come muoversi</h3>
        </button>

        <button class="menu-card">
          <span class="menu-icon">🚨</span>
          <h3>Numeri utili</h3>
        </button>

      </div>

      <a href="#home" class="back-home">
        ↑ Torna alla Home
      </a>

    </div>

  </section>

  </body>
</html>

</body>
</html>
