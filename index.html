<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6b7d62">
  <title>Aria di Campo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #333;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(
        135deg,
        #dfe6d8,
        #f5f1e8
      );
    }

    .welcome {
      max-width: 600px;
      width: 100%;
    }

    .logo-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #777;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome-text {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 10px;
      color: #59664f;
      text-transform: uppercase;
    }

    h1 {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #3f4d39;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 40px;
      color: #666;
    }

    .start-button {
      display: inline-block;
      padding: 16px 32px;
      background: #6b7d62;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 17px;
      transition: 0.2s;
    }

    .start-button:hover {
      background: #53634d;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .welcome-text {
        font-size: 15px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="welcome">

      <div class="logo-placeholder">
        IL TUO LOGO
      </div>

      <div class="welcome-text">
        Benvenuti
      </div>

      <h1>Aria di Campo</h1>

      <p class="subtitle">
        La vostra casa, la vostra vacanza.
      </p>

      <a href="#" class="start-button">
        Scopri la casa →
      </a>

    </div>

  </section>

</body>
</html>
